version: '3.8'

services:
  database:
    image: postgres:15
    container_name: ecommerce-postgres
    env_file:
      - .env
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - ./database/sql:/docker-entrypoint-initdb.d
      - ecommerce_pgdata:/var/lib/postgresql/data

volumes:
  ecommerce_pgdata:
