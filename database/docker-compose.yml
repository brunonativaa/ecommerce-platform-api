version: '3.8'

services:
  database:
    image: postgres:15
    container_name: ecommerce-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: e_commerce

    ports:
      - "5432:5432"

    volumes:
      - ./src:/scripts
      - ecommerce_pgdata:/var/lib/postgresql/data
      

volumes:
  ecommerce_pgdata:
